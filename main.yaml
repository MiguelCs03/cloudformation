AWSTemplateFormatVersion: "2010-09-09"
Description: "Stack Padre - Orquestador de Plantillas Anidadas"

Parameters:
  Proyecto:
    Type: String
    Default: globomatics
    Description: Nombre del proyecto base

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Entorno de despliegue (dev, qa, prod)

  TipoInstancia:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
    Description: Tipo de instancia EC2 para computo

  ImagenLinux:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Parametro SSM que resuelve la ultima AMI oficial de Amazon Linux 2023

Resources:
  # Stack anidado de red
  RedStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: red.yaml
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente

  # Stack anidado de seguridad
  SeguridadStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: RedStack
    Properties:
      TemplateURL: seguridad.yaml
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        VpcId: !GetAtt RedStack.Outputs.VpcId

  # Stack anidado de servidores
  ServidoresStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - RedStack
      - SeguridadStack
    Properties:
      TemplateURL: servidores.yaml
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        TipoInstancia: !Ref TipoInstancia
        ImagenLinux: !Ref ImagenLinux
        SecurityGroupId: !GetAtt SeguridadStack.Outputs.SecurityGroupId
        SubnetId: !GetAtt RedStack.Outputs.SubnetId

Outputs:
  IpPublicaFrontend:
    Description: IP publica de la instancia Frontend
    Value: !GetAtt ServidoresStack.Outputs.IpPublicaFrontend

  IpPublicaBackend:
    Description: IP publica de la instancia Backend
    Value: !GetAtt ServidoresStack.Outputs.IpPublicaBackend

  IpPublicaBaseDatos:
    Description: IP publica de la instancia Base de Datos
    Value: !GetAtt ServidoresStack.Outputs.IpPublicaBaseDatos