AWSTemplateFormatVersion: "2010-09-09"
Description: "Plantilla Hija - Servidores de Computo"

Parameters:
  Proyecto:
    Type: String
    Description: Nombre del proyecto base

  Ambiente:
    Type: String
    Description: Entorno de despliegue

  TipoInstancia:
    Type: String
    Description: Tipo de instancia EC2 para computo

  ImagenLinux:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Parametro SSM para resolver la AMI de Amazon Linux 2023

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ID del Grupo de Seguridad inyectado

Resources:
  # Servidor 1: Frontend
  InstanciaFrontend:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImagenLinux
      InstanceType: !Ref TipoInstancia
      SecurityGroupIds:
        - !Ref SecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "vm-${Proyecto}-${Ambiente}-frontend"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente
        - Key: Capa
          Value: Frontend

  # Servidor 2: Backend
  InstanciaBackend:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImagenLinux
      InstanceType: !Ref TipoInstancia
      SecurityGroupIds:
        - !Ref SecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "vm-${Proyecto}-${Ambiente}-backend"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente
        - Key: Capa
          Value: Backend

  # Servidor 3: Base de Datos
  InstanciaBaseDatos:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImagenLinux
      InstanceType: !Ref TipoInstancia
      SecurityGroupIds:
        - !Ref SecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "vm-${Proyecto}-${Ambiente}-database"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente
        - Key: Capa
          Value: Database

Outputs:
  IpPublicaFrontend:
    Description: IP publica del servidor Frontend
    Value: !GetAtt InstanciaFrontend.PublicIp

  IpPublicaBackend:
    Description: IP publica del servidor Backend
    Value: !GetAtt InstanciaBackend.PublicIp

  IpPublicaBaseDatos:
    Description: IP publica del servidor Base de Datos
    Value: !GetAtt InstanciaBaseDatos.PublicIp
