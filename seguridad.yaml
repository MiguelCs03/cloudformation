AWSTemplateFormatVersion: "2010-09-09"
Description: "Plantilla Hija - Grupos de Seguridad"

Parameters:
  Proyecto:
    Type: String
    Default: globomatics
    Description: Nombre del proyecto base

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Entorno de despliegue (dev, qa, prod)

Resources:
  GrupoSeguridad:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Grupo de Seguridad para ${Proyecto}-${Ambiente}"
      SecurityGroupIngress:
        # Acceso administrativo SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: "Acceso administrativo SSH"
        # Acceso web HTTP Frontend
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "Trafico web HTTP Frontend"
        # Acceso web cifrado HTTPS Frontend
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "Trafico web HTTPS Frontend"
        # Puerto Backend API / Microservicios
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
          Description: "Puerto de aplicacion Backend API"
      Tags:
        - Key: Name
          Value: !Sub "sg-${Proyecto}-${Ambiente}"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente

Outputs:
  SecurityGroupId:
    Description: ID del Grupo de Seguridad generado
    Value: !Ref GrupoSeguridad
