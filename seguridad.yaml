AWSTemplateFormatVersion: "2010-09-09"
Description: "Plantilla Hija - Grupos de Seguridad"

Parameters:
  Proyecto:
    Type: String
    Default: globomatics
    Description: Nombre del proyecto base

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Entorno de despliegue

Resources:
  GrupoSeguridad:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Grupo de Seguridad para ${Proyecto}-${Ambiente}"
      SecurityGroupIngress:
        # Regla de ingreso SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: "Acceso administrativo SSH"
        # Regla de ingreso HTTP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "Trafico web HTTP"
        # Regla de ingreso HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "Trafico web HTTPS"
        # Regla de ingreso API Backend
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
          Description: "Puerto de comunicacion API"
          # Regla adicional para probar una actualizacion del stack
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: "Puerto alternativo de prueba"
      Tags:
        - Key: Name
          Value: !Sub "sg-${Proyecto}-${Ambiente}"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente

Outputs:
  SecurityGroupId:
    Description: ID del Grupo de Seguridad generado
    Value: !GetAtt GrupoSeguridad.GroupId
